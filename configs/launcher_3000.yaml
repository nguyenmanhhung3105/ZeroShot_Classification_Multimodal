# CrisisMMD chính: 3.000 cặp dùng chung hai task, nhãn ảnh, từ phần train chung.
# Đọc cấu hình chính và pro_crisismmd; dữ liệu trước đây nằm ở pro_crisismmd_v1.
# Không ghép kết quả cohort mới với kết quả đầu tệp 3.000 mẫu đã lưu trước đây.
# Mỗi lệnh chọn một --job và một --model; các job đều cần được gọi tường minh.
use_kaggle: false
experiment_config: configs/experiment_config.yaml

kaggle:
  username: nguyenhung3105
  code_dataset_slug: vlm-runs-code
  data_dataset_slug: vlm-runs-data
  data_mode: full_dataset
  kernel_slug: vlm-runs
  accelerator: NvidiaTeslaT4
  timeout_seconds: 7200
  poll_seconds: 20

jobs:
  fakeddit_2way:
    enabled: false
    kind: standard
    dataset: fakeddit
    task: 2way
    max_samples: 3000
    models: &models [metaclip2_vith14, dfn5b_vith14, siglip2_so400m, openai_clip_vit_b_32]
    prompt_aggregations: [mean_sim]
    prompt_variants: [current]
    image_text_relation: &no_relation
      enabled: false
    ensemble:
      enabled: false

  fakeddit_6way:
    enabled: false
    kind: standard
    dataset: fakeddit
    task: 6way
    max_samples: 3000
    models: *models
    prompt_aggregations: [mean_sim]
    prompt_variants: [current]
    image_text_relation: *no_relation
    ensemble:
      enabled: false

  mmimdb_genres:
    enabled: false
    kind: standard
    dataset: mmimdb
    task: genres
    max_samples: 3000
    models: *models
    prompt_aggregations: [mean_sim]
    image_text_relation: *no_relation
    ensemble:
      enabled: false

  crisismmd_info:
    enabled: false
    kind: standard
    dataset: crisismmd
    task: informativeness
    max_samples: 3000
    models: *models
    prompt_aggregations: [mean_embed]
    image_text_relation: *no_relation
    ensemble:
      enabled: false

  crisismmd_humanitarian:
    enabled: false
    kind: standard
    dataset: crisismmd
    task: humanitarian
    max_samples: 3000
    models: *models
    prompt_aggregations: [mean_embed]
    image_text_relation: *no_relation
    ensemble:
      enabled: false

  adapted_crisismmd_info:
    enabled: false
    kind: adapted
    dataset: crisismmd
    task: informativeness
    max_samples: 3000
    models: *models
    methods: [dclip]
    research_config: configs/research/adapted.yaml
    image_text_relation: *no_relation

  adapted_crisismmd_humanitarian:
    enabled: false
    kind: adapted
    dataset: crisismmd
    task: humanitarian
    max_samples: 3000
    models: *models
    methods: [dclip]
    research_config: configs/research/adapted.yaml
    image_text_relation: *no_relation
