# Thử phương pháp trên model hiện có; chạy bằng src/research/run_adapted_methods.py.
base_config: configs/experiment_config.yaml
dataset: crisismmd              # fakeddit | crisismmd | mmimdb
task: humanitarian             # fakeddit: 2way/6way; mmimdb: genres
max_samples: 1000              # giới hạn hiện tại; đặt 5 để chạy thử nhỏ
methods: [baseline, current_mean_sim, class_name, waffle]
seeds: [0, 1, 2, 3, 4]         # chỉ lặp seed cho waffle
waffle_pairs: 15               # mỗi lớp nhận 15 prompt từ và 15 prompt ký tự
descriptor_file: configs/research/descriptors/crisismmd_humanitarian.json
# Thêm dclip vào methods để dùng descriptor_file cho nhánh ảnh.
output_dir: results/paper_methods
# Model, fusion, scale, chunking và ngưỡng lấy từ base_config.
# Đây là bản thích nghi, không tái lập toàn bộ thí nghiệm của paper.
