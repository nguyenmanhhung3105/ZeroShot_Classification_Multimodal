# ============================================================
# CONFIG TRUNG TÂM CHO TOÀN BỘ THÍ NGHIỆM
# - Muốn chạy model nào: giữ model đó, comment model không cần
# - Muốn chạy dataset nào: enabled: true
# ============================================================

# ============================================================
# MODELS
# ============================================================
models:
  # - metaclip2_vith14
  # - dfn5b_vith14
  - siglip2_so400m

# ============================================================
# DATASETS
# ============================================================
datasets:

  # ----------------------------------------------------------
  # FAKEDDIT
  # task: "2way" hoặc "6way"
  # cột thật: id, clean_title, image_path, hasImage, 2_way_label, 6_way_label
  # ----------------------------------------------------------
  fakeddit:
    enabled: true
    task: "2way"
    data_path: "data/processed/pro_fakeddit/fakeddit_sample.tsv"
    image_dir: "data/processed/pro_fakeddit/images"
    task_type: "single_label"
    id_col: id
    text_col: clean_title
    label_col_2way: 2_way_label
    label_col_6way: 6_way_label
    min_text_length: 20
    max_samples: 1000

  # ----------------------------------------------------------
  # CRISISMMD
  # task: "informativeness" hoặc "humanitarian"
  # cột thật: tweet_id, image_id, clean_text, image_path, image_url,
  #           label_informative, label_humanitarian, event
  # ----------------------------------------------------------
  crisismmd:
    enabled: true
    task: "humanitarian"
    data_path: "data/processed/pro_crisismmd/pre_crisismmd.tsv"
    image_dir: "data/processed/pro_crisismmd/images"
    task_type: "single_label"
    id_col: tweet_id
    text_col: clean_text
    label_col: label_humanitarian
    max_samples: 1000

  # ----------------------------------------------------------
  # MMIMDB
  # cột thật: id, plot, genres, n_genres, image_path
  # ----------------------------------------------------------
  mmimdb:
    enabled: true
    task: "genres"
    data_path: "data/processed/pro_mmimdb/mmimdb_sample.tsv"
    image_dir: "data/processed/pro_mmimdb/images"
    task_type: "multi_label"
    decision_mode: "relative_z"
    chunk_long_text: true  # encode mọi chunk của plot
    chunk_aggregation: max_sim  # baseline; mean_embed đổi max_sim để thử max cosine từng nhãn
    relative_z_threshold: 1.0
    threshold: 0.22  # chỉ dùng khi decision_mode: fixed_threshold
    id_col: id
    text_col: plot
    label_col: genres
    max_samples: 1000
    # thresholds:
    #   metaclip2_vith14: 0.22
    #   dfn5b_vith14: 0.22
    #   siglip2_so400m: 0.22

# ============================================================
# INFERENCE
# ============================================================
evaluation:
  enabled: true
  split: val  # user-provided designation; runner does not verify split provenance
  sample_lock_mode: "off"  # không tạo/kiểm tra khóa mẫu; vẫn lưu báo cáo evaluation
  sample_lock_dir: results/sample_locks
  measure_truncation: true

inference:
  batch_size: 16
  text_logit_scale: null  # null: scale gốc của model; số dương: scale tuyệt đối
  text_logit_scale_overrides:
    fakeddit: 25   # thử 25, 50; null để chạy baseline
    crisismmd: null  # thử 25, 50; scale ảnh không đổi
    mmimdb: null    # relative_z bỏ qua scale; chỉ fixed_threshold mới áp dụng
  image_weight: 0.5   # mặc định toàn cục. 1.0 = image-only | 0.0 = text-only
  image_weight_overrides:
    # Trọng số ảnh w; trọng số text tự động = 1-w. Phạm vi [0, 1].
    # Các giá trị riêng này được ưu tiên hơn image_weight toàn cục ở trên.
    fakeddit: 0.75  # ảnh 75%, text 25%; dùng cho cả 2way và 6way
    crisismmd: 0.25  # ảnh 50%, text 50%; dùng cho cả hai task
    mmimdb: 0.5     # ảnh 50%, text 50%; độc lập với bật/tắt chunking

# ============================================================
# DEMO
# ============================================================
demo:
  n_samples: 10
  batch_size: 4
  prompt_version: "v1"
  log_dir: "results/demo_logs"
  visualization_dir: "results/demo"

# ============================================================
# OUTPUT TOÀN BỘ EXPERIMENT
# ============================================================
output:
  results_dir: "results/"
  raw_predictions_dir: "results/raw_predictions/"
  summary_table: "results/summary_table.tsv"
